name: Workflow Interface Preserved

on:
  workflow_call:
    inputs:
      deploy-target:
        type: string
      logLevel:
        type: string
    outputs:
      app-url:
        description: The URL
        value: ${{ jobs.deploy.outputs.app_url }}
    secrets:
      api-key:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      app_url: ${{ steps.deploy.outputs.url }}
    steps:
      - id: deploy
        run: echo ${{ inputs.deploy-target }} ${{ inputs.logLevel }}
