name: Reusable Deploy Workflow

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment
        type: string
        required: true
      debug:
        type: boolean
        required: false
      version:
        description: Version to deploy
        type: string
        required: false
        default: latest
    outputs:
      deploy-url:
        description: The deployed URL
        value: ${{ jobs.deploy.outputs.url }}
    secrets:
      DEPLOY_TOKEN:
        description: Token for deployment
        required: true
      API_KEY:
        required: false
      SLACK_WEBHOOK:
        description: Optional Slack webhook
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        id: deploy
        run: echo "url=https://${{ inputs.environment }}.example.com" >> "$GITHUB_OUTPUT"
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
