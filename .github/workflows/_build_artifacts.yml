name: Build Artifacts

on:
  workflow_call:
    inputs:
      version:
        description: "Version to set in Cargo.toml before building (e.g. 0.0.0-nightly.20260315.abc1234)"
        type: string
        required: true
      retention_days:
        description: "Number of days to retain uploaded artifacts"
        type: number
        required: false
        default: 90

jobs:
  build_artifacts:
    name: Build Artifacts (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # We'd like to include other architectures too, however:
        # - x86_64-pc-windows-msvc is excluded until libfyaml compiles cleanly
        # under MSVC (tracked for v3). The C sources use GNU statement
        # expressions, mmap, and POSIX headers with no _WIN32 guards — this
        # requires upstream changes to libfyaml, not just fyaml-sys.
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Set Cargo version
        uses: ./.github/actions/set-cargo-version
        with:
          version: ${{ inputs.version }}

      - name: Set up Zig
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: latest

      - name: Install cargo-zigbuild
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-zigbuild

      - name: Build
        if: runner.os == 'Linux'
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Build
        if: runner.os != 'Linux'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Sign and notarize binary
        if: runner.os == 'macOS' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/sign-and-notarize
        with:
          api-issuer-id: ${{ secrets.APPLE_API_ISSUER_ID }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-key-p8: ${{ secrets.APPLE_API_KEY_P8 }}
          binary-path: target/${{ matrix.target }}/release/ghafmt
          certificate-p12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Compute artifact prefix
        id: version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "prefix=ghafmt-${VERSION#*-}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Package artifact
        run: tar -czf "${{ steps.version.outputs.prefix }}-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" ghafmt

      - name: Compute checksum
        run: |
          sha256sum "${{ steps.version.outputs.prefix }}-${{ matrix.target }}.tar.gz" \
            | awk '{print $1}' \
            > "${{ steps.version.outputs.prefix }}-${{ matrix.target }}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.version.outputs.prefix }}-${{ matrix.target }}
          path: ${{ steps.version.outputs.prefix }}-${{ matrix.target }}.*
          retention-days: ${{ inputs.retention_days }}
