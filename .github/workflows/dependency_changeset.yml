name: Generate Dependency Changeset

on:
  pull_request:
    types: [opened, reopened]

jobs:
  generate_changeset:
    name: Generate Changeset
    if: github.event.pull_request.user.login == 'renovate[bot]' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Generate App token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 2
          ref: ${{ github.head_ref }}
          token: ${{ steps.app_token.outputs.token }}

      - name: Amend changeset into PR commit
        run: |
          FILE=".changeset/dependency_pr_${PR_NUMBER}.md"
          if [ -f "$FILE" ]; then
            echo "Changeset already present; nothing to do."
            exit 0
          fi
          printf -- '---\ndefault: dependencies\n---\n\n%s\n' \
            "$PR_TITLE" > "$FILE"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git add .changeset/
          git commit --amend --no-edit
          git push --force-with-lease
        env:
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
