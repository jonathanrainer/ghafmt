[package]
name = "ghafmt"
version = "0.1.5"
edition = "2024"
authors = ["Jonathan Rainer <jonathan@jonathan-rainer.com>"]
rust-version = "1.92.0"
description = "A formatter for GitHub Actions workflow and action metadata files"
readme = "README.md"
repository = "https://github.com/jonathanrainer/ghafmt"
license = "MIT OR Apache-2.0"
keywords = ["ci", "github-actions", "format"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
atomic-write-file = "=0.3.1"
clap = { version = "=4.6.6", features = ["derive"] }
fyaml = "=0.5.2"
heck = "=0.5.0"
miette = { version = "=7.6.0", features = ["fancy"] }
patharg = "=0.4.1"
regex = "=1.13.1"
similar = "=3.1.2"
strum = { version = "0.28.0", features = ["derive"] }
tempfile = "=3.27.0"
thiserror = "=2.0.20"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
walkdir = "=2.5.0"

[lints.clippy]
pedantic = "warn"
unwrap_used = "warn"
expect_used = "warn"
missing_docs_in_private_items = "warn"

[dev-dependencies]
assert_cmd = "=2.2.2"
indoc = "=2.0.7"
predicates = "=3.1.4"
rstest = "=0.26.1"
similar-asserts = "=2.0.0"
tempfile = "=3.27.0"

[patch.crates-io]
fyaml = { git = "https://github.com/jonathanrainer/fyaml", rev = "3746918b35ad7439b33281e65f35c13b301cfe77" }
fyaml-sys = { git = "https://github.com/jonathanrainer/fyaml-sys", rev = "35ecbf59436573c299f819a2cafc0014c8912e8b" }

